schemaVersion: 1
# Managed by Gala CLI. Change visual choices under design; use `gala upgrade`
# to change this exact artifact pin so installed files and the pin stay aligned.
framework:
  themePackage:
    name: "@rathnasgala/theme"
    version: 0.0.9
site:
  id: unavailable
  name: New Gala Site
  author: New Gala Site
  defaultLanguage: en
  timezone: UTC
hosting:
  provider: github-pages
  topology: provider-default
  canonicalBaseUrl: unavailable
  pathPrefix: /unavailable
  canonicalPolicy: self
design:
  theme: editorial
  layout: article-first
  palette: default
  typography: system
  spacing: comfortable
  radius: soft
  density: comfortable
  motion: subtle
  componentStyle: quiet
  colorMode: system
sharing:
  targets: []
  socialProfiles: {}
# Author-owned. Public access exposes only aggregate view counts; unique-visitor
# estimates and audience dimensions always remain owner-only.
statistics:
  publicViewCounts: false
# Author-owned. Omission is equivalent to disabled. Authenticated submissions
# are delivered to the owning author's verified Gala account email.
contact:
  enabled: false
  websiteEnabled: false
  phoneEnabled: false
# Author-owned, scaffold-initialized uncompressed byte ceilings for Gala-managed
# assets and ordinary HTML. Authored media and third-party analytics are excluded;
# their performance impact remains the author's responsibility under FR-1903.
performance:
  budgets:
    managedJavaScriptBytes: 32768
    managedCssBytes: 16384
    ordinaryHtmlBytes: 32768
